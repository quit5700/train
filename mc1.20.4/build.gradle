plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

loom { runtimeOnlyLog4j = true }

sourceSets {
    main.java.srcDir 'src/client/java'
}

configurations {
    fabricApiForTests
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    fabricApiForTests "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'java_version', project.java_version
    inputs.property 'fabric_version', project.fabric_version
    filesMatching('fabric.mod.json') {
        expand([
                version: project.version,
                loader_version: project.loader_version,
                minecraft_version: project.minecraft_version,
                java_version: project.java_version,
                fabric_version: project.fabric_version
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.java_version)
    options.encoding = 'UTF-8'
}

def asciiTestRoot = file("${System.getProperty('java.io.tmpdir')}/fabric-train-test/${project.minecraft_version}")
tasks.register('syncAsciiTestOutputs', Sync) {
    dependsOn tasks.named('testClasses')
    into asciiTestRoot
    from("$buildDir/classes/java/main") { into 'main-classes' }
    from("$buildDir/resources/main") { into 'main-resources' }
    from("$buildDir/classes/java/test") { into 'test-classes' }
    from("$buildDir/resources/test") { into 'test-resources' }
    from(configurations.minecraftNamedRuntime) {
        include 'minecraft-merged-*.jar'
        into 'runtime'
    }
    from({ configurations.fabricApiForTests.collect { zipTree(it) } }) {
        include 'META-INF/jars/*.jar'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
        into 'runtime'
    }
    from(configurations.fabricApiForTests) { into 'runtime' }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn tasks.named('syncAsciiTestOutputs')
    testClassesDirs = files("$asciiTestRoot/test-classes")
    classpath = files(
            "$asciiTestRoot/test-classes",
            "$asciiTestRoot/test-resources",
            "$asciiTestRoot/main-classes",
            "$asciiTestRoot/main-resources"
    ) + fileTree("$asciiTestRoot/runtime") + configurations.testRuntimeClasspath + configurations.runtimeClasspath
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

tasks.register('copyDistribution', Copy) {
    dependsOn tasks.named('remapJar'), tasks.named('remapSourcesJar')
    into layout.projectDirectory.dir('dist')
    from(tasks.named('remapJar')) {
        rename { "fabric-train-simulator-${project.mod_version}-mc${project.minecraft_version}-fabric.jar" }
    }
    from(tasks.named('remapSourcesJar')) {
        rename { "fabric-train-simulator-${project.mod_version}-mc${project.minecraft_version}-fabric-sources.jar" }
    }
}

tasks.named('build') { finalizedBy tasks.named('copyDistribution') }
