plugins { id 'fabric-loom' version '1.6.12' }
version = project.mod_version
group = 'cn.quit5700'
base { archivesName = 'fabric-train-simulator' }
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
loom { runtimeOnlyLog4j = true; splitEnvironmentSourceSets(); mods { station_access { sourceSet sourceSets.main; sourceSet sourceSets.client } } }

dependencies {
    modCompileOnly files(rootProject.file('../../../test-fixtures/jade/Jade-1.20.4-fabric-13.3.1.jar'))
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api-base:0.4.32+1802ada577'
    modImplementation 'net.fabricmc.fabric-api:fabric-events-interaction-v0:0.6.5+13a40c6677'
    modImplementation 'net.fabricmc.fabric-api:fabric-item-group-api-v1:4.0.14+1802ada577'
    modImplementation 'net.fabricmc.fabric-api:fabric-lifecycle-events-v1:2.2.23+1802ada577'
    modImplementation 'net.fabricmc.fabric-api:fabric-networking-api-v1:1.3.14+a158aa0477'
    modImplementation 'net.fabricmc.fabric-api:fabric-object-builder-api-v1:11.1.5+e35120df77'
    modImplementation 'net.fabricmc.fabric-api:fabric-registry-sync-v0:2.3.6+1802ada577'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-rendering-v1:3.0.9+1802ada577'
    modImplementation 'net.fabricmc.fabric-api:fabric-screen-api-v1:2.0.9+1802ada577'
    modImplementation 'net.fabricmc.fabric-api:fabric-blockrenderlayer-v1:1.1.42+1802ada577'
    modRuntimeOnly 'net.fabricmc.fabric-api:fabric-api:0.92.7+1.20.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources { inputs.property 'version',project.version; filesMatching('fabric.mod.json') { filter { it.replace('@VERSION@',project.version.toString()) } } }
tasks.withType(JavaCompile).configureEach { options.release=17; options.encoding='UTF-8'; options.fork=true; options.forkOptions.jvmArgs=['-Dfile.encoding=UTF-8','-Dstdout.encoding=UTF-8','-Dstderr.encoding=UTF-8'] }
java { withSourcesJar(); sourceCompatibility=JavaVersion.VERSION_17; targetCompatibility=JavaVersion.VERSION_17 }
tasks.named('sourcesJar') { inputs.property 'version',project.version; filteringCharset='UTF-8'; filesMatching('fabric.mod.json') { filter { it.replace('@VERSION@',project.version.toString()) } } }
def asciiRoot=file(System.getProperty('java.io.tmpdir')+'/integrated-train-tests/1.20.1-0.2.42')
tasks.register('syncAsciiTests',Sync) { dependsOn 'testClasses'; into asciiRoot; from('build/classes/java/main'){into 'main'};from('build/resources/main'){into 'resources'};from('build/classes/java/test'){into 'test'} }
tasks.withType(Test).configureEach { useJUnitPlatform();dependsOn 'syncAsciiTests';testClassesDirs=files(new File(asciiRoot,'test'));classpath=files(new File(asciiRoot,'test'),new File(asciiRoot,'main'),new File(asciiRoot,'resources'))+configurations.testRuntimeClasspath+configurations.runtimeClasspath;jvmArgs '-Dfile.encoding=UTF-8','-Dstdout.encoding=UTF-8','-Dstderr.encoding=UTF-8' }
loom.runs.server { runDir 'run-smoke'; if(project.hasProperty('smoke')) vmArg ('-Dstation_access.smoke='+project.property('smoke')) }
tasks.register('writeSmokeLaunch') {
 dependsOn 'classes','configureLaunch'
 doLast { def cfg=net.fabricmc.loom.configuration.ide.RunConfig.runConfig(project,loom.runs.getByName('server'));def command=[file(System.getProperty('java.home')+'/bin/java.exe').absolutePath]+cfg.vmArgs+['-Dfile.encoding=UTF-8','-Dstdout.encoding=UTF-8','-Dstderr.encoding=UTF-8','-cp',tasks.named('runServer').get().classpath.asPath,cfg.mainClass]+cfg.programArgs;file('build/server-command.json').setText(groovy.json.JsonOutput.toJson([command:command,environment:cfg.environmentVariables]),'UTF-8') }
}

tasks.withType(Test).configureEach { systemProperty 'station_access.helpApiJar', project.findProperty('helpApiJar') ?: rootProject.file('../../../test-fixtures/quick-build-help-api1-java17.jar').absolutePath }

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath + sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.output + sourceSets.client.runtimeClasspath
tasks.named('compileTestJava') { dependsOn 'clientClasses' }
tasks.named('syncAsciiTests') { from('build/classes/java/client') { into 'main' } }

// 完整运行依赖同步到纯英文临时目录，保证中文项目路径下测试能找到游戏类。
tasks.named('syncAsciiTests') {
 from({ tasks.named('runServer').get().classpath.filter { it.isFile() && it.name.endsWith('.jar') } }) { into 'runtime-jars' }
}
tasks.withType(Test).configureEach { classpath += fileTree(new File(asciiRoot,'runtime-jars')) { include '*.jar' } }

tasks.register('copyDistribution', Copy) {
    dependsOn tasks.named('remapJar'), tasks.named('remapSourcesJar')
    into layout.projectDirectory.dir('dist')
    from(tasks.named('remapJar')) { rename { "fabric-train-simulator-${project.mod_version}-mc1.20.1-fabric.jar" } }
    from(tasks.named('remapSourcesJar')) { rename { "fabric-train-simulator-${project.mod_version}-mc1.20.1-fabric-sources.jar" } }
}
tasks.named('build') { finalizedBy tasks.named('copyDistribution') }

// 同步独立测试基线到现有中文路径兼容测试资源目录。
tasks.named('syncAsciiTests') { from('build/resources/test') { into 'resources' } }

// 为独立原生回归导出本版本真实的开发命名编译类路径，不依赖旧测试工程。
tasks.register('writeReleaseProbeClasspath') {
    dependsOn 'classes'
    doLast {
        def env = sourceSets.findByName('client') ?: sourceSets.main
        file('build/release-probe-classpath.txt').setText((env.compileClasspath + sourceSets.main.output + env.output).asPath, 'UTF-8')
    }
}
