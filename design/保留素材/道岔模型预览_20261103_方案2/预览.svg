<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="1100" height="540" fill="#20262e"/><g fill="#f3f5f7" font-family="Microsoft YaHei,sans-serif"><text x="26" y="42" font-size="28">原道岔模型 · 方向标记预览</text><text x="26" y="78" font-size="17" fill="#c6d1db">直接复用现有16×16材质，保留轨道、木枕、钻石色边轨和原方向短线。</text><rect x="26" y="108" width="246" height="278" fill="#303945" stroke="#647385"/><text x="149" y="140" text-anchor="middle" font-size="21">原模型（对照）</text><svg x="40" y="154" width="218" height="218" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect width="16" height="16" fill="#638b48"/><image width="16" height="16" style="image-rendering:pixelated" href="data:image/png;base64,"/></svg><rect x="290" y="108" width="246" height="278" fill="#303945" stroke="#647385"/><text x="413" y="140" text-anchor="middle" font-size="21">直行</text><svg x="304" y="154" width="218" height="218" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect width="16" height="16" fill="#638b48"/><image width="16" height="16" style="image-rendering:pixelated" href="data:image/png;base64,"/><g fill="#ed2024"><rect x="8" y="12" width="1" height="1"/><rect x="7" y="13" width="3" height="1"/><rect x="6" y="14" width="5" height="1"/></g></svg><rect x="554" y="108" width="246" height="278" fill="#303945" stroke="#647385"/><text x="677" y="140" text-anchor="middle" font-size="21">左转</text><svg x="568" y="154" width="218" height="218" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect width="16" height="16" fill="#638b48"/><image width="16" height="16" style="image-rendering:pixelated" href="data:image/png;base64,"/><g fill="#ed2024"><rect x="8" y="12" width="1" height="1"/><rect x="7" y="13" width="3" height="1"/><rect x="6" y="14" width="5" height="1"/></g></svg><rect x="818" y="108" width="246" height="278" fill="#303945" stroke="#647385"/><text x="941" y="140" text-anchor="middle" font-size="21">右转</text><svg x="832" y="154" width="218" height="218" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect width="16" height="16" fill="#638b48"/><image width="16" height="16" style="image-rendering:pixelated" href="data:image/png;base64,"/><g fill="#ed2024"><rect x="8" y="12" width="1" height="1"/><rect x="7" y="13" width="3" height="1"/><rect x="6" y="14" width="5" height="1"/></g></svg><text x="26" y="426" font-size="18"><tspan fill="#ff6669">红色三角：</tspan>加在原来的固定出发短线上，尖端始终指向直行。</text><text x="26" y="461" font-size="18">另一条原有钻石色短线：分别指示直行、左转、右转。</text><text x="26" y="505" font-size="16" fill="#bcc9d4">原材质叠加标记预览，尚未改动模组模型、原PNG及运行包。</text></g></svg>